name: Build AL-YAHYAWI JCG Q20 Extreme Power

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-dev rsync subversion swig time unzip wget \
            xsltproc zlib1g-dev curl xz-utils

      - name: Download ImageBuilder
        run: |
          set -euxo pipefail
          URL="https://downloads.immortalwrt.org/releases/23.05.2/targets/ramips/mt7621/immortalwrt-imagebuilder-23.05.2-ramips-mt7621.Linux-x86_64.tar.xz"
          curl -fL --retry 3 "$URL" -o imagebuilder.tar.xz
          mkdir imagebuilder
          tar -xJf imagebuilder.tar.xz -C imagebuilder --strip-components=1

      - name: Add High-Power & Custom System Configuration
        run: |
          set -euxo pipefail
          mkdir -p imagebuilder/files/etc/config
          mkdir -p imagebuilder/files/etc/uci-defaults

          # 1. إعدادات النظام واسم الجهاز
          cat > imagebuilder/files/etc/config/system <<'EOF'
          config system
              option hostname 'AL-YAHYAWI-EXTREME'
              option description 'اليحيوي للتجارة ومستلزمات الشبكات - قدرة قصوى'
              option timezone 'UTC'
              option zonename 'UTC'
              option log_size '64'

          config timeserver 'ntp'
              list server '0.openwrt.pool.ntp.org'
              list server '1.openwrt.pool.ntp.org'
              list server '2.openwrt.pool.ntp.org'
              list server '3.openwrt.pool.ntp.org'
              option enabled '1'
              option enable_server '0'
          EOF

          # 2. الشعار عند الدخول عبر SSH
          cat > imagebuilder/files/etc/banner <<'EOF'
          ================================================
          اليحيوي للتجارة ومستلزمات الشبكات
          AL-YAHYAWI-OPENWRT - EXTREME HIGH POWER EDITION
          JCG Q20 (PB-Boot) | ALYAHYAWIWRT
          ================================================
          EOF

          # 3. تعطيل الـ DHCP للعمل كـ Bridge/Access Point
          cat > imagebuilder/files/etc/config/dhcp <<'EOF'
          config dhcp 'lan'
              option interface 'lan'
              option ignore '1'
              option ra 'disabled'
              option dhcpv6 'disabled'
              option ndp 'disabled'
          EOF

          # 4. واجهة Argon
          cat > imagebuilder/files/etc/config/luci <<'EOF'
          config core 'main'
              option lang 'auto'
              option mediaurlbase '/luci-static/argon'
              option resourcebase '/luci-static/resources'
          EOF

          # 5. سكربت التشغيل التلقائي لاكتشاف كروت الواي فاي الحقيقية ومنع تكرارها وتطبيق الطاقة القصوى
          cat > imagebuilder/files/etc/uci-defaults/99-extreme-wifi <<'EOF'
          #!/bin/sh
          # التعرف التلقائي على هاردوير الكروت لمنع ظهور راديوهات وهمية
          wifi config

          # تطبيق إعدادات الطاقة القصوى وأسماء الشبكات على الكروت المكتشفة فعلياً
          uci -q batch <<'EOU'
          set wireless.radio0.disabled='0'
          set wireless.radio0.country='PA'
          set wireless.radio0.channel='11'
          set wireless.radio0.htmode='HE20'
          set wireless.radio0.txpower='30'
          set wireless.default_radio0.ssid='AL-YAHYAWI-EXTREME-2.4G'
          set wireless.default_radio0.encryption='none'
          set wireless.default_radio0.disassoc_low_ack='0'

          set wireless.radio1.disabled='0'
          set wireless.radio1.country='PA'
          set wireless.radio1.channel='149'
          set wireless.radio1.htmode='HE40'
          set wireless.radio1.txpower='30'
          set wireless.default_radio1.ssid='AL-YAHYAWI-EXTREME-5G'
          set wireless.default_radio1.encryption='none'
          set wireless.default_radio1.disassoc_low_ack='0'
          commit wireless
          EOU

          iw reg set PA || true
          wifi reload
          exit 0
          EOF
          chmod +x imagebuilder/files/etc/uci-defaults/99-extreme-wifi

      - name: Build firmware
        run: |
          set -euxo pipefail
          cd imagebuilder
          make image \
            PROFILE="jcg_q20-pb-boot" \
            PACKAGES="luci-theme-argon lldpd luci-app-lldpd tcpdump ethtool kmod-mt7915e kmod-mt76 iw hostapd-utils iperf3 bash -dnsmasq -firewall4 -odhcpd-ipv6only -wireless-regdb" \
            FILES="files"

      - name: Verify and copy all outputs
        run: |
          set -euxo pipefail
          mkdir -p output
          # نسخ كافة الملفات الناتجة للجهاز لضمان توفر ملف الـ Factory/PB-Boot المناسب للتفليش المباشر
          cp -v imagebuilder/bin/targets/ramips/mt7621/*jcg_q20* output/ || cp -v imagebuilder/bin/targets/ramips/mt7621/*.bin output/
          sha256sum output/*
          ls -lh output/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AL-YAHYAWI-JCG-Q20-Firmware-Package
          path: output/
          if-no-files-found: error
