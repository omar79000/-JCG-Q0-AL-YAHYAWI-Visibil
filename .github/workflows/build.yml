name: Build AL-YAHYAWI JCG Q20 High-Power

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-setuptools python3-dev rsync subversion swig time unzip wget \
            xsltproc zlib1g-dev curl xz-utils

      - name: Download ImageBuilder
        run: |
          set -euxo pipefail
          URL="https://downloads.immortalwrt.org/releases/23.05.2/targets/ramips/mt7621/immortalwrt-imagebuilder-23.05.2-ramips-mt7621.Linux-x86_64.tar.xz"
          curl -fL --retry 3 "$URL" -o imagebuilder.tar.xz
          mkdir imagebuilder
          tar -xJf imagebuilder.tar.xz -C imagebuilder --strip-components=1

      - name: Add High-Power & Custom System Configuration
        run: |
          set -euxo pipefail
          mkdir -p imagebuilder/files/etc/config
          mkdir -p imagebuilder/files/etc/uci-defaults

          # 1. إعدادات النظام واسم الجهاز
          cat > imagebuilder/files/etc/config/system <<'EOF'
          config system
              option hostname 'AL-YAHYAWI-OPENWRT'
              option description 'اليحيوي للتجارة ومستلزمات الشبكات'
              option timezone 'UTC'
              option zonename 'UTC'
              option log_size '64'

          config timeserver 'ntp'
              list server '0.openwrt.pool.ntp.org'
              list server '1.openwrt.pool.ntp.org'
              list server '2.openwrt.pool.ntp.org'
              list server '3.openwrt.pool.ntp.org'
              option enabled '1'
              option enable_server '0'
          EOF

          # 2. الشعار عند الدخول عبر SSH
          cat > imagebuilder/files/etc/banner <<'EOF'
          ================================================
          اليحيوي للتجارة ومستلزمات الشبكات
          AL-YAHYAWI-OPENWRT - HIGH POWER EDITION
          JCG Q20 (PB-Boot) | ALYAHYAWIWRT
          ================================================
          EOF

          # 3. إعدادات الواي فاي المتقدمة لأعلى قدرة بث واستقرار ميداني
          cat > imagebuilder/files/etc/config/wireless <<'EOF'
          config wifi-device 'radio0'
              option type 'mac80211'
              option band '2g'
              option channel '11'
              option htmode 'HE20'
              option country 'PA'
              option txpower '30'
              option disabled '0'
              option cell_density '0'
              option coverage_class '0'

          config wifi-iface 'default_radio0'
              option device 'radio0'
              option network 'lan'
              option mode 'ap'
              option ssid 'AL-YAHYAWI-2.4G'
              option encryption 'none'
              option beacon_int '50'
              option dtim_period '1'
              option disassoc_low_ack '0'
              option isolate '0'

          config wifi-device 'radio1'
              option type 'mac80211'
              option band '5g'
              option channel '149'
              option htmode 'HE40'
              option country 'PA'
              option txpower '30'
              option disabled '0'
              option cell_density '0'
              option coverage_class '0'

          config wifi-iface 'default_radio1'
              option device 'radio1'
              option network 'lan'
              option mode 'ap'
              option ssid 'AL-YAHYAWI-5G'
              option encryption 'none'
              option beacon_int '100'
              option dtim_period '2'
              option disassoc_low_ack '0'
              option isolate '0'
          EOF

          # 4. تعطيل الـ DHCP للعمل كـ Bridge/Access Point
          cat > imagebuilder/files/etc/config/dhcp <<'EOF'
          config dhcp 'lan'
              option interface 'lan'
              option ignore '1'
              option ra 'disabled'
              option dhcpv6 'disabled'
              option ndp 'disabled'
          EOF

          # 5. واجهة Argon
          cat > imagebuilder/files/etc/config/luci <<'EOF'
          config core 'main'
              option lang 'auto'
              option mediaurlbase '/luci-static/argon'
              option resourcebase '/luci-static/resources'
          EOF

          # 6. سكربت لتجاوز قيود تعريف mt76 وضبط النطاق الجغرافي عند الإقلاع الأول
          cat > imagebuilder/files/etc/uci-defaults/99-override-txpower <<'EOF'
          #!/bin/sh
          iw reg set PA
          exit 0
          EOF
          chmod +x imagebuilder/files/etc/uci-defaults/99-override-txpower

      - name: Build firmware
        run: |
          set -euxo pipefail
          cd imagebuilder
          make image \
            PROFILE="jcg_q20-pb-boot" \
            PACKAGES="luci-theme-argon lldpd luci-app-lldpd tcpdump ethtool kmod-mt7915e -dnsmasq -firewall4 -odhcpd-ipv6only -wireless-regdb" \
            FILES="files"

      - name: Verify and rename output
        run: |
          set -euxo pipefail
          mkdir -p output
          IMAGE="$(find imagebuilder/bin/targets/ramips/mt7621 -maxdepth 1 -type f -name '*sysupgrade.bin' | head -n 1)"
          test -n "$IMAGE"
          cp "$IMAGE" output/AL-YAHYAWI-JCG-Q20-sysupgrade.bin
          sha256sum output/AL-YAHYAWI-JCG-Q20-sysupgrade.bin
          ls -lh output/AL-YAHYAWI-JCG-Q20-sysupgrade.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: AL-YAHYAWI-JCG-Q20-firmware
          path: output/AL-YAHYAWI-JCG-Q20-sysupgrade.bin
          if-no-files-found: error
